<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Воронка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0D11;--s1:#15161C;--s2:#1D1F27;--s3:#282A34;--line:rgba(255,255,255,.07);
  --tx:#F4F4F7;--tx2:#9C9EAB;--tx3:#5E606D;--acc:#FF5C8A;--ok:#38D996;--warn:#FFB547;--bad:#FF5C5C;--plan:#6C7BFF;
  --glass:rgba(21,22,28,.82);--shadow:0 10px 40px rgba(0,0,0,.45);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
[data-theme=light]{
  --bg:#F2F2F6;--s1:#FFFFFF;--s2:#F2F2F7;--s3:#E4E5EC;--line:rgba(0,0,0,.07);
  --tx:#14151A;--tx2:#6A6D7A;--tx3:#A6A8B3;--glass:rgba(255,255,255,.85);--shadow:0 10px 40px rgba(20,20,40,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Manrope,-apple-system,system-ui,sans-serif;font-size:15px;height:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);background:none;border:0;outline:0;width:100%}
input::placeholder,textarea::placeholder{color:var(--tx3)}
.num{font-variant-numeric:tabular-nums}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st)}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.02em;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--s2);font-weight:600;font-size:13px;white-space:nowrap}
.pill svg{width:14px;height:14px;opacity:.7}
.ibtn{width:34px;height:34px;border-radius:17px;background:var(--s2);display:grid;place-items:center}
.ibtn svg{width:18px;height:18px}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(110px + var(--sb));-webkit-overflow-scrolling:touch}

.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sb));height:62px;display:flex;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--tx3);transition:color .2s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--tx)}
.tab.on svg{color:var(--acc)}
#fab{position:fixed;right:20px;bottom:calc(84px + var(--sb));width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,#FF5C8A,#FF9346);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(255,92,138,.45);z-index:6;transition:transform .2s}
#fab:active{transform:scale(.92)}
#fab svg{width:26px;height:26px}

.card{background:var(--s1);border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.ct{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.ct .sp{flex:1}
.q{width:18px;height:18px;border-radius:9px;background:var(--s3);color:var(--tx2);font-size:11px;font-weight:800;display:inline-grid;place-items:center;flex:none;text-transform:none;letter-spacing:0}

.seg{display:flex;background:var(--s2);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:11px;font-weight:600;font-size:13px;color:var(--tx2);transition:all .2s}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.15)}
[data-theme=dark] .seg button.on{background:var(--s3)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px;position:relative}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:11px;color:var(--tx2);font-weight:600}
.kpi .q{position:absolute;top:8px;right:8px;width:16px;height:16px;font-size:10px}

.fr{display:grid;grid-template-columns:92px 1fr 50px;align-items:center;gap:8px;padding:5px 0}
.fr-l{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;flex:none}
.fr-bar{height:34px;display:flex;justify-content:center;align-items:center;position:relative}
.fr-fill{height:100%;border-radius:10px;min-width:30px;display:grid;place-items:center;transition:width .6s cubic-bezier(.2,.8,.2,1);color:#fff;font-weight:800;font-size:14px}
.fr-c{text-align:right;line-height:1.15}
.fr-c b{font-size:14px;font-weight:800;display:block}
.fr-c small{font-size:11px;color:var(--tx3);font-weight:600}
.fhead{display:grid;grid-template-columns:92px 1fr 50px;gap:8px;font-size:11px;color:var(--tx3);font-weight:600;margin-bottom:2px}
.fhead div:last-child{text-align:right}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--s2);font-size:13px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
.chip.on{background:var(--tx);color:var(--bg)}
.chip .x{opacity:.6;margin-left:2px}

.pipe{display:flex;gap:6px;flex-wrap:wrap}
.pp{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;background:var(--s2);font-size:12px;font-weight:700}

.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{background:var(--s2);border-radius:14px;padding:10px 12px;position:relative}
.mt b{font-size:20px;font-weight:800;display:block}
.mt span{font-size:11px;color:var(--tx2);font-weight:600}
.mt small{font-size:11px;color:var(--tx3);font-weight:600;display:block;margin-top:2px}
#view > .mini .mt{background:var(--s1);border:1px solid var(--line)}
.mt .q{position:absolute;top:8px;right:8px;width:16px;height:16px;font-size:10px}

.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.search svg{width:18px;height:18px;color:var(--tx3);flex:none}

.g{display:flex;align-items:center;gap:12px;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:20px;margin-bottom:8px;transition:transform .15s;animation:fin .3s ease both}
.g:active{transform:scale(.985)}
.g.lost{opacity:.55}
@keyframes fin{from{opacity:0;transform:translateY(6px)}}
.av{width:50px;height:50px;border-radius:16px;flex:none;object-fit:cover;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.g-m{flex:1;min-width:0}
.g-n{font-weight:700;font-size:16px;display:flex;align-items:baseline;gap:6px;min-width:0}
.g-n .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnum{flex:none;font-size:12px;font-weight:700;color:var(--tx3)}
.h-num{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:3px 8px;border-radius:8px;margin-bottom:6px}
.g-s{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.prog{display:flex;gap:3px;margin-top:7px}
.prog i{height:4px;flex:1;border-radius:2px;background:var(--s3)}
.adv{flex:none;height:36px;padding:0 10px;border-radius:12px;background:var(--s2);font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.adv svg{width:14px;height:14px}
.badge{flex:none;font-size:11px;font-weight:700;padding:5px 8px;border-radius:10px}

.empty{text-align:center;padding:50px 20px 20px}
.empty svg{width:96px;height:96px;margin-bottom:14px}
.empty h3{font-size:20px;font-weight:800;margin-bottom:6px}
.empty p{color:var(--tx2);font-size:14px;margin-bottom:20px}
.btn{height:50px;border-radius:16px;padding:0 20px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s2)}
.btn.pri{background:linear-gradient(135deg,#FF5C8A,#FF9346);color:#fff}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--tx2)}
.btn.danger{color:var(--bad)}
.btn:active{opacity:.8}
.btn svg{width:20px;height:20px;flex:none}

/* reasons */
.lr{margin-bottom:14px}
.lr:last-child{margin-bottom:0}
.lr-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:8px}
.lr-h .sp{flex:1}
.rb{display:grid;grid-template-columns:1fr 28px;gap:8px;align-items:center;margin:5px 0}
.rb-t{position:relative;height:30px;border-radius:9px;background:var(--s2);overflow:hidden;display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:600}
.rb-t i{position:absolute;left:0;top:0;bottom:0;opacity:.28;border-radius:9px}
.rb-t span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb b{text-align:right;font-size:13px}
.sr{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;gap:8px}
.sr:last-child{border:0}
.sr .sp{flex:1}
.sr b{font-weight:800}
.arrow{color:var(--tx3);font-size:12px}

/* page */
#page{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(30px + var(--sb))}
#page.open{transform:none}
.hero{position:relative;height:calc(300px + var(--st));overflow:hidden}
.hero .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .bgini{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;color:rgba(255,255,255,.9)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%);pointer-events:none}
.hero-top{position:absolute;top:calc(12px + var(--st));left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.hbtn{width:40px;height:40px;border-radius:20px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center}
.hbtn svg{width:20px;height:20px}
.hero-b{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:#fff}
.hero-b input{color:#fff}
.h-name{font-size:30px;font-weight:800;letter-spacing:-.02em;padding:0}
.h-name::placeholder{color:rgba(255,255,255,.5)}
.h-loc{display:flex;align-items:center;gap:6px;opacity:.9;font-weight:600;font-size:14px;margin-top:2px}
.h-loc svg{width:16px;height:16px;flex:none}
.h-loc input::placeholder{color:rgba(255,255,255,.55)}
.pad{padding:14px 16px 0}
.lostbar{display:flex;align-items:center;gap:10px;background:rgba(255,92,92,.12);color:var(--bad);border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:12px}
.lostbar .sp{flex:1}
.busybar{display:flex;align-items:center;gap:10px;background:rgba(255,181,71,.14);color:#E89A1C;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:12px}
.busybar.due{background:rgba(255,92,138,.12);color:var(--acc)}
.tm{color:var(--acc);font-weight:700}
.th{color:var(--plan);font-weight:700}
.ballrow{display:flex;align-items:center;gap:12px}
.ballrow .bl{font-weight:700;font-size:15px;display:flex;flex-direction:column;flex:none}
.ballrow .bl span{display:flex;align-items:center;gap:6px}
.ballrow .bl small{font-size:11px;color:var(--tx3);font-weight:600}
.ballrow .seg{flex:1}
.seg button.bme.on{background:var(--acc);color:#fff}
.seg button.bher.on{background:var(--plan);color:#fff}
.turns{display:flex;gap:8px;margin-bottom:12px}
.turns button{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;height:40px;padding:0 12px;border-radius:12px;font-weight:700;font-size:13px}
.busybar{flex-wrap:wrap}
.busybar .sp{flex:1 1 100%}
.busybar .btn{flex:1;background:rgba(255,255,255,.55)}
[data-theme=dark] .busybar .btn{background:rgba(255,255,255,.08)}
.busybar small{display:block;font-weight:600;opacity:.85;font-size:12px;margin-top:1px}
.g-s.busy{color:#E89A1C;font-weight:600}
.g-s.due{color:var(--acc);font-weight:700}
.g.due{border-color:rgba(255,92,138,.45)}
.lostbar small{display:block;font-weight:600;opacity:.8;font-size:12px;margin-top:1px}

.steps{position:relative}
.step{display:flex;align-items:center;gap:12px;padding:8px 0;position:relative}
.step .sd{width:30px;height:30px;border-radius:15px;border:2px solid var(--s3);display:grid;place-items:center;flex:none;position:relative;z-index:1;background:var(--s1);transition:all .2s}
.step .sd svg{width:16px;height:16px;color:#fff;opacity:0}
.step.on .sd svg{opacity:1}
.step .sl{flex:1;font-weight:700;font-size:15px}
.step:not(.on) .sl{color:var(--tx3)}
.step .sl small{display:block;font-size:11px;font-weight:600;color:var(--tx3)}
.step input[type=date]{width:auto;font-size:13px;font-weight:700;color:var(--tx2);background:var(--s2);border-radius:10px;padding:6px 8px;height:32px}
.dwrap{position:relative;display:inline-flex;align-items:center;flex:none}
.dwrap.fw{display:flex}
.dwrap.nodate input{color:transparent!important}
.dwrap.nodate input::-webkit-datetime-edit{color:transparent}
.dwrap.nodate:after{content:'без даты';position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--tx3);font-weight:700;font-size:13px;pointer-events:none}
.dwrap.fw.nodate:after{left:0;font-size:16px;font-weight:600}
.step .dwrap input{width:132px}
.dclr{width:28px;height:28px;border-radius:9px;background:var(--s2);color:var(--tx3);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none;margin-left:-6px}
.nod{margin-left:auto;font-size:11px;font-weight:700;color:var(--plan);text-transform:none;letter-spacing:0;padding:0}
.step .plus{width:32px;height:32px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--tx3)}
.step .plus svg{width:16px;height:16px}
.step:before{content:"";position:absolute;left:14px;top:-8px;height:16px;width:2px;background:var(--s3)}
.step:first-child:before{display:none}
.step.on:before{background:var(--lc)}
.step.skip .sd{border-style:dashed}

.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
.mdate{width:46px;text-align:center;flex:none}
.mdate b{display:block;font-size:20px;font-weight:800;line-height:1}
.mdate span{font-size:11px;color:var(--tx2);font-weight:700;text-transform:uppercase}
.mm{flex:1;min-width:0}
.mm .ms{font-size:12px;color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px}
.addm{height:30px;padding:0 10px;border-radius:10px;background:var(--s2);font-size:12px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--tx);display:inline-flex;align-items:center;gap:4px}
.note{width:100%;min-height:90px;resize:none;background:var(--s2);border-radius:14px;padding:12px;line-height:1.45}
.acts{display:flex;gap:8px;margin-top:4px}
.acts .btn{flex:1}

/* sheet */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;transition:opacity .25s}
.bd.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--s1);border-radius:26px 26px 0 0;z-index:41;padding:8px 16px calc(18px + var(--sb));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:calc(100% - var(--st) - 16px);overflow-y:auto;overscroll-behavior:contain}
textarea.auto{resize:none;overflow:hidden;display:block;line-height:1.4}
.fld input[type=date]{text-align:left;-webkit-appearance:none;appearance:none;min-height:24px}
.fld input[type=date]::-webkit-date-and-time-value{text-align:left}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
.sheet h2{font-size:20px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sheet h2 small{font-size:13px;color:var(--tx2);font-weight:600}
.fld{background:var(--s2);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.fld label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.fld input,.fld textarea{font-size:16px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo-pick{width:88px;height:88px;border-radius:28px;background:var(--s2);margin:0 auto 14px;display:grid;place-items:center;color:var(--tx3);overflow:hidden;border:2px dashed var(--s3)}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick svg{width:28px;height:28px}
.rgrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rc{height:38px;padding:0 14px;border-radius:12px;background:var(--s2);font-weight:600;font-size:14px;border:2px solid transparent}
.rc.on{border-color:var(--acc);background:rgba(255,92,138,.12)}
.slbl{font-size:12px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 8px;display:flex;align-items:center;gap:6px}
.sbtns{display:flex;gap:8px;margin-top:6px}
.sbtns .btn{flex:1}
.list-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--s2);margin-bottom:8px;font-weight:700;text-align:left}
.list-btn svg{width:20px;height:20px;flex:none;color:var(--tx2)}
.list-btn small{display:block;font-weight:600;font-size:12px;color:var(--tx3)}
.list-btn.danger{color:var(--bad)}
.list-btn.danger svg{color:var(--bad)}

#toast{position:fixed;left:16px;right:16px;top:calc(14px + var(--st));z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast .t{background:var(--tx);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);pointer-events:auto;animation:tin .25s ease}
#toast .t button{color:var(--acc);font-weight:800}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

.hint{position:fixed;z-index:80;max-width:280px;background:var(--tx);color:var(--bg);font-size:13px;line-height:1.45;font-weight:600;padding:12px 14px;border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .15s,transform .15s;white-space:pre-line}
.hint.show{opacity:1;transform:none;pointer-events:auto}
.sub{font-size:12px;color:var(--tx3);font-weight:600;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1 id="title">Воронка</h1>
    <button class="pill" id="periodBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="periodLbl">30 дней</span></button>

  meets: 'Здесь все встречи: запланированные, прошедшие, перенесённые и отменённые. Добавляй их через «+ Встреча».\n\nЭтапы и встречи связаны: отметишь этап «Встреча» или «2-е свидание» — встреча появится здесь сама, и наоборот.\n\nПеренос — отметь, кто перенёс, и укажи новую дату: появится новая встреча в плане.',

/* ============ storage ============ */
const LS = 'vf_data_v1', LP = 'vf_prefs_v1';
let DB = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {girls: [], savedAt: 0}; } catch (e) { return {girls: [], savedAt: 0}; } })();
let P = Object.assign({preset:'m', from:'', to:'', mode:'cohort'}, (() => { try { return JSON.parse(localStorage.getItem(LP)) || {}; } catch (e) { return {}; } })());
const savePrefs = () => { try { localStorage.setItem(LP, JSON.stringify(P)); } catch (e) {} };
function save() {
  DB.girls.forEach(syncStageMeets);
  DB.savedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) { toast('Не хватает памяти устройства'); }

// Photos → IndexedDB (fallback: memory + localStorage)
const PH = {};
const idb = {
  db: null,
  open() { return new Promise(res => { try { const r = indexedDB.open('vf', 1); r.onupgradeneeded = () => r.result.createObjectStore('ph'); r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); } catch (e) { res(false); } }); },
  put(k, v) { if (!this.db) { try { localStorage.setItem('vf_ph_' + k, v); } catch (e) {} return; } const t = this.db.transaction('ph', 'readwrite'); t.objectStore('ph').put(v, k); },
  del(k) { if (!this.db) { localStorage.removeItem('vf_ph_' + k); return; } const t = this.db.transaction('ph', 'readwrite'); t.objectStore('ph').delete(k); },
  all() { return new Promise(res => {
    const out = {};
    if (!this.db) { Object.keys(localStorage).filter(k => k.startsWith('vf_ph_')).forEach(k => out[k.slice(6)] = localStorage.getItem(k)); return res(out); }
    const c = this.db.transaction('ph').objectStore('ph').openCursor();
    c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } else res(out); };
    c.onerror = () => res(out);
  }); },
};
const setPhoto = (id, v) => { if (v) { PH[id] = v; idb.put(id, v); } else { delete PH[id]; idb.del(id); } };

// Telegram CloudStorage sync (text only)
const CS = ver('6.9') && tg.CloudStorage ? tg.CloudStorage : null;
let cloudT;
function cloudSave() {
  if (!CS) return;
  clearTimeout(cloudT);
  cloudT = setTimeout(() => {
    const s = JSON.stringify(DB), n = Math.ceil(s.length / 3800) || 1;
    const parts = Array.from({length: n}, (_, i) => s.slice(i * 3800, (i + 1) * 3800));
    let i = 0;
    const next = () => { if (i < n) { CS.setItem('d' + i, parts[i], () => { i++; next(); }); } else CS.setItem('dn', String(n)); };
    next();
  }, 900);
}
function cloudLoad() {
  if (!CS) return;
  CS.getItem('dn', (e, v) => {
    const n = +v; if (e || !n) { if (DB.girls.length) cloudSave(); return; }
    CS.getItems(Array.from({length: n}, (_, i) => 'd' + i), (e2, vals) => {
      if (e2 || !vals) return;
      try {
        const obj = JSON.parse(Array.from({length: n}, (_, i) => vals['d' + i] || '').join(''));
        if (obj && obj.girls && (obj.savedAt || 0) > (DB.savedAt || 0)) { DB = obj; ensureNums(); try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (x) {} render(); }
      } catch (x) {}
    });
  });
}

/* ============ girl logic ============ */
const cur = g => { for (let k = 7; k >= 1; k--) if (g.st[k]) return k; return 0; };
const nextStage = g => { const c = cur(g); return c >= 7 ? 0 : c === 5 ? 6 : c + 1; };
const status = g => g.lost ? 'lost' : g.st[7] ? 'done' : 'active';
const lastDate = g => [...Object.values(g.st), ...g.meets.map(m => m.date), g.lost && g.lost.date].filter(isD).sort().pop() || '';
const busyState = g => !g.busy || g.lost || g.st[7] ? '' : !g.busy.until || g.busy.until >= today() ? 'busy' : 'due';
function ensureNums(renumber) {
  if (renumber) DB.girls.forEach(g => delete g.num);
  let mx = Math.max(0, ...DB.girls.map(g => g.num || 0)), ch = false;
  DB.girls.filter(g => !g.num).sort((a, b) => (a.st[1] || '').localeCompare(b.st[1] || '') || a.created - b.created).forEach(g => { g.num = ++mx; ch = true; });
  return ch;
}
// stages 5/6 ↔ «Была» meetings: every reached meeting stage has a linked meeting in the list
function syncStageMeets(g) {
  let ch = false;
  for (const k of [5, 6]) {
    const m = g.meets.find(x => x.stage === k);
    if (g.st[k]) {
      if (!m) {
        const c = g.meets.find(x => x.status === 'done' && !x.stage && x.date === g.st[k]);
        if (c) c.stage = k; else g.meets.push({id: uid(), date: g.st[k], status: 'done', who: '', note: '', stage: k, auto: true});
        ch = true;
      } else if (m.date !== g.st[k]) { m.date = g.st[k]; ch = true; }
    } else if (m) {
      if (m.auto && m.status === 'done' && !m.note) g.meets = g.meets.filter(x => x !== m); else delete m.stage;
      ch = true;
    }
  }
  return ch;
}
const AUTO_BALL = {1: 'her', 2: 'me', 3: 'her', 4: '', 5: 'me', 6: 'me', 7: ''};
function setBall(g, v) { v = v || ''; if ((g.ball || '') !== v) { g.ball = v; g.ballAt = today(); } }
const ballOf = g => status(g) === 'active' && busyState(g) !== 'busy' ? (g.ball || '') : '';
const busyTxt = g => g.busy ? [g.busy.reason, g.busy.note].filter(Boolean).join(' · ') : '';
const byId = id => DB.girls.find(g => g.id === id);
function newGirl({name = '', loc = '', note = '', date = today(), demo = false} = {}) {
  return {id: uid(), name, loc, note, st: {1: date}, meets: [], lost: null, created: Date.now(), upd: Date.now(), demo, ball: 'her', ballAt: date};
}
function setStage(g, k, date) {
  const before = cur(g);
  g.st[k] = date;
  if (k >= before) setBall(g, AUTO_BALL[k]);
  for (let j = 1; j < k; j++) { if (k === 7 && j === 6) continue; if (!g.st[j]) g.st[j] = date; }
  if (g.lost && k >= g.lost.stage) g.lost = null;
  g.busy = null;
  g.upd = Date.now();
}
function unsetStage(g, k) {
  delete g.st[k];
  for (let j = k + 1; j <= 7; j++) { if (k === 6 && j === 7) continue; delete g.st[j]; }
  if (!g.st[1]) g.st[1] = today();
  g.upd = Date.now();
}
function syncMeets(g) {
  const ms = [...g.meets].sort((a, b) => a.date < b.date ? -1 : 1);
  if (ms.length && !g.st[4]) { const d = ms[0].date < today() ? ms[0].date : today(); setStage(g, 4, d); }
  const done = ms.filter(m => m.status === 'done').map(m => m.date);
  if (done[0] && !g.st[5]) setStage(g, 5, done[0]);
  if (done[1] && !g.st[6]) setStage(g, 6, done[1]);
}

/* ============ period ============ */
const PRESETS = [['w','7 дней'],['m','30 дней'],['q','90 дней'],['y','Год'],['all','Всё время']];
function range() {
  const t = today();
  switch (P.preset) {
    case 'w': return [addDays(t, -6), t];
    case 'm': return [addDays(t, -29), t];
    case 'q': return [addDays(t, -89), t];
    case 'y': return [addDays(t, -364), t];
    case 'custom': return [P.from || '0000-01-01', P.to || '9999-12-31'];
    default: return ['0000-01-01', '9999-12-31'];
  }
}
const inR = (d, r) => d === NODATE ? r[0] === '0000-01-01' && r[1] === '9999-12-31' : !!d && d >= r[0] && d <= r[1];
function periodLabel() {
  if (P.preset === 'custom') { return (P.from ? fmt(P.from) : '…') + ' – ' + (P.to ? fmt(P.to) : '…'); }
  return (PRESETS.find(p => p[0] === P.preset) || PRESETS[1])[1];
}
function sample() {
  const r = range(), res = [0,0,0,0,0,0,0,0];
  let pool;
  if (P.mode === 'cohort') {
    pool = DB.girls.filter(g => inR(g.st[1], r));
    pool.forEach(g => { for (let k = 1; k <= 7; k++) if (g.st[k]) res[k]++; });
  } else {
    pool = DB.girls.filter(g => Object.values(g.st).some(d => inR(d, r)) || g.meets.some(m => inR(m.date, r)) || (g.lost && inR(g.lost.date, r)));
    DB.girls.forEach(g => { for (let k = 1; k <= 7; k++) if (inR(g.st[k], r)) res[k]++; });
  }
  return {r, res, pool};
}
const stepConv = (res, k) => k === 1 ? null : k === 7 ? pct(res[7], res[5]) : pct(res[k], res[k - 1]);

/* ============ UI helpers ============ */
function toast(msg, undo) {

  box.innerHTML = `<div class="t"><span>${esc(msg)}</span>${undo ? '<button>Отменить</button>' : ''}</div>`;
  if (undo) box.querySelector('button').onclick = () => { undo(); box.innerHTML = ''; };
  clearTimeout(toast.t); toast.t = setTimeout(() => box.innerHTML = '', undo ? 4000 : 2200);
}
function confirmBox(msg, cb) {
  if (ver('6.2')) tg.showConfirm(msg, ok => ok && cb()); else if (confirm(msg)) cb();
}

/* ============ sheets ============ */
function openSheet(html, mount) {
  const wrap = $('#sheets');
  const bd = document.createElement('div'); bd.className = 'bd';
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = '<div class="grab"></div>' + html;
  wrap.append(bd, sh);
  requestAnimationFrame(() => { bd.classList.add('open'); sh.classList.add('open'); });
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    const i = navStack.indexOf(close); if (i >= 0) { navStack.splice(i, 1); syncBack(); }
    bd.classList.remove('open'); sh.classList.remove('open');
    setTimeout(() => { bd.remove(); sh.remove(); }, 320);
  };
  bd.onclick = close;
  pushNav(close);
  // swipe down to close
  let y0 = null;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0) y0 = e.touches[0].clientY; }, {passive: true});
  sh.addEventListener('touchmove', e => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; } }, {passive: true});
  sh.addEventListener('touchend', e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transition = ''; sh.style.transform = ''; y0 = null; if (dy > 90) close(); });
  mount && mount(sh, close);
  requestAnimationFrame(() => autosizeIn(sh));
  return close;
}

/* ---------- list tab ---------- */
function renderList(v) {
  const r = range();

  if (LF.status === 'pause') list = list.filter(g => busyState(g));
  else if (LF.status === 'me' || LF.status === 'her') list = list.filter(g => ballOf(g) === LF.status);
  else if (LF.status !== 'all') list = list.filter(g => status(g) === LF.status);
  if (LF.stage) list = list.filter(g => cur(g) === LF.stage);
  if (LF.period) list = list.filter(g => Object.values(g.st).some(d => inR(d, r)) || g.meets.some(m => inR(m.date, r)));
  if (LF.q) { const s = LF.q.toLowerCase().trim(), n = /^[#№]?\d+$/.test(s) ? +s.replace(/\D/g, '') : 0; list = list.filter(g => n ? g.num === n : (g.name + ' ' + g.loc + ' ' + g.note).toLowerCase().includes(s)); }
  list.sort((a, b) => (busyState(b) === 'due') - (busyState(a) === 'due') || (ballOf(b) === 'me') - (ballOf(a) === 'me') || (lastDate(b) + b.upd).localeCompare(lastDate(a) + a.upd));
  const cnt = st => DB.girls.filter(g => st === 'all' || (st === 'pause' ? busyState(g) : st === 'me' || st === 'her' ? ballOf(g) === st : status(g) === st)).length;
  const chip = (st, label) => `<button class="chip ${LF.status === st ? 'on' : ''}" data-s="${st}">${label} <span class="num" style="opacity:.6">${cnt(st)}</span></button>`;

  v.innerHTML = `
    <div class="search">${IC.search}<input id="qs" placeholder="Имя, место, заметка или №" value="${esc(LF.q)}"></div>
    <div class="chips">
      ${LF.stage ? `<button class="chip on" id="stx" style="background:${S(LF.stage).c};color:#fff">${S(LF.stage).n}<span class="x">✕</span></button>` : ''}
      ${chip('active', 'В работе')}${cnt('me') ? chip('me', 'Мой ход') : ''}${cnt('her') ? chip('her', 'Жду её') : ''}${cnt('pause') ? chip('pause', '⏸ Пауза') : ''}${chip('done', 'Финал')}${chip('lost', 'Слив')}${chip('all', 'Все')}
      <button class="chip ${LF.period ? 'on' : ''}" id="lp">За период</button>
    </div>
    <div id="gl">${list.length ? list.map(cardHTML).join('') : `<div class="sub" style="padding:40px 0">Никого не найдено</div>`}</div>`;

  const stx = $('#stx'); if (stx) stx.onclick = () => { LF.stage = 0; renderList(v); };

function cardHTML(g) {

/* ---------- why tab ---------- */
function renderWhy(v) {
  const {r, pool} = sample();
  const lostSet = P.mode === 'cohort' ? pool.filter(g => g.lost) : DB.girls.filter(g => g.lost && inR(g.lost.date, r));
  const by = {};
  lostSet.forEach(g => { const k = g.lost.stage; (by[k] = by[k] || {}); const rs = g.lost.reason || 'Без причины'; by[k][rs] = (by[k][rs] || 0) + 1; });
  const stages = Object.keys(by).map(Number).sort((a, b) => a - b);
  const lossHTML = stages.length ? stages.map(k => {
    const items = Object.entries(by[k]).sort((a, b) => b[1] - a[1]), tot = items.reduce((s, x) => s + x[1], 0), mx = items[0][1];
    return `<div class="lr"><div class="lr-h"><span class="dot" style="background:${S(k).c}"></span>${LOSS_T[k]}<span class="sp"></span><span class="num" style="color:var(--tx2)">${tot}</span></div>
      ${items.map(([rs, n]) => `<div class="rb"><div class="rb-t"><i style="width:${n / mx * 100}%;background:${S(k).c}"></i><span>${esc(rs)}</span></div><b class="num">${n}</b></div>`).join('')}</div>`;
  }).join('') : `<div class="sub" style="padding:14px 0">Сливов за период нет</div>`;

  const meets = DB.girls.flatMap(g => g.meets).filter(m => inR(m.date, r));
  const mc = s => meets.filter(m => m.status === s);
  const who = (arr) => { const me = arr.filter(m => m.who === 'me').length, her = arr.filter(m => m.who === 'her').length; return `она ${her} · я ${me}`; };

  const pairs = [[1,2,'Написал → ответила'],[2,3,'Ответила → позвал'],[3,5,'Позвал → встреча'],[5,6,'Встреча → 2-е'],[1,5,'Написал → встреча']];
  const spd = pairs.map(([a, b, n]) => { const m = median(pool.filter(g => isD(g.st[a]) && isD(g.st[b])).map(g => Math.max(0, dDiff(g.st[a], g.st[b])))); return `<div class="sr"><span>${n}</span><span class="sp"></span><b class="num">${m === null ? '—' : (Math.round(m * 10) / 10) + ' дн.'}</b></div>`; }).join('');

  v.innerHTML = `
    <div class="card"><div class="ct">Где теряю <span class="num" style="color:var(--tx)">${lostSet.length}</span><span class="sp"></span>${q('losses')}</div>${lossHTML}</div>
    <div class="card"><div class="ct">Встречи<span class="sp"></span>${q('meets')}</div>
      <div class="mini">
        <div class="mt"><b class="num" style="color:var(--plan)">${meets.length}</b><span>назначено</span></div>
        <div class="mt"><b class="num" style="color:var(--ok)">${mc('done').length}</b><span>состоялись</span></div>
        <div class="mt"><b class="num" style="color:var(--warn)">${mc('resch').length}</b><span>переносы</span><small>${who(mc('resch'))}</small></div>
        <div class="mt"><b class="num" style="color:var(--bad)">${mc('cancel').length}</b><span>отмены</span><small>${who(mc('cancel'))}</small></div>
      </div>
    </div>
    <div class="card"><div class="ct">Скорость, медиана<span class="sp"></span>${q('speed')}</div>${spd}</div>`;
}

  requestAnimationFrame(() => autosizeIn(page));

/* ============ photo ============ */
function pickPhoto(cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      const m = 640, s = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', .8));
    };
    img.onerror = () => toast('Не удалось открыть фото');
    img.src = url;
  };
  i.click();
}
function photoSheet(g) {
  if (!PH[g.id]) { pickPhoto(d => { setPhoto(g.id, d); drawGirl(); }); return; }
  openSheet(`<h2>Фото</h2>
    <button class="list-btn" id="phN">${IC.cam}Заменить</button>
    <button class="list-btn danger" id="phD">${IC.trash}Удалить фото</button>`, (sh, close) => {
    $('#phN', sh).onclick = () => { close(); pickPhoto(d => { setPhoto(g.id, d); drawGirl(); }); };
    $('#phD', sh).onclick = () => { close(); setPhoto(g.id, null); drawGirl(); };
  });
}

function busySheet(g) {

  if (reason && !REAS.includes(reason) && !note) { const [a, ...rest] = reason.split(' — '); if (REAS.includes(a)) { reason = a; note = rest.join(' — '); } else { note = reason; reason = ''; } }
  openSheet(`<h2>Пауза ${q('busy')}</h2>

    <div class="fld"><label>Или вставь JSON</label><textarea id="iTxt" rows="4" style="resize:none;font-size:13px"></textarea></div>
    <button class="btn pri full" id="iGo">Восстановить</button>
    <div class="sub">Текущие данные будут заменены</div>`, (sh, close) => {
    const apply = txt => {
      try {
        const o = JSON.parse(txt); if (!o || !Array.isArray(o.girls)) throw 0;
        confirmBox(`Заменить данные на ${o.girls.length} ${plural(o.girls.length,'карточку','карточки','карточек')}?`, () => {
          DB.girls.forEach(g => setPhoto(g.id, null));
          DB.girls = o.girls; ensureNums(); if (o.photos) Object.entries(o.photos).forEach(([k, v]) => setPhoto(k, v));
          save(); close(); render(); hapN('success'); toast('Восстановлено');
        });
      } catch (e) { hapN('error'); toast('Не похоже на бэкап'); }
    };
    $('#iFile', sh).onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.onchange = () => { const f = i.files[0]; if (f) f.text().then(apply); }; i.click(); };
    $('#iGo', sh).onclick = () => apply($('#iTxt', sh).value);
  });
}

/* ============ demo ============ */
function makeDemo() {
  const names = ['Аня','Маша','Катя','Лиза','Даша','Соня','Вика','Полина','Алина','Ника','Ева','Кира','Оля','Настя','Юля','Вера','Мила','Лера','Саша','Таня','Ира','Женя','Diana','Kate','Mia','Sofia','Лена','Рита','Алиса','Злата','Ксюша','Arina','Эмма','Lina','Майя','Ульяна'];
  const locs = ['Tinder','Tinder','Bumble','Instagram','Кофейня, Чангу','Пляж Бату Болонг','Коворкинг','Йога, Убуд','Вечеринка, Улувату','Спортзал'];
  const t = today(), pick = a => a[Math.floor(Math.random() * a.length)], rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pTo = {2: .72, 3: .8, 4: .7, 5: .82, 6: .6, 7: .55};
  names.forEach(name => {
    const g = newGirl({name, loc: pick(locs), date: addDays(t, -rnd(0, 60)), demo: true});
    let k = 1, d = g.st[1], stopped = 'fail';
    while (k < 7) {
      let nx = k === 5 && Math.random() < .14 ? 7 : k + 1;
      const nd = addDays(d, nx === 2 ? rnd(0, 2) : nx === 5 ? rnd(1, 6) : nx >= 6 ? rnd(3, 10) : rnd(0, 3));
      if (nd > t) { stopped = 'time'; break; }
      if (Math.random() > (pTo[nx] || .5)) { stopped = 'fail'; break; }
      if (nx === 5 && Math.random() < .3) g.meets.push({id: uid(), date: addDays(nd, -2), status: 'resch', who: Math.random() < .6 ? 'her' : 'me', note: ''});
      if (nx === 5) g.meets.push({id: uid(), date: nd, status: 'done', who: '', note: ''});
      if (nx === 6) g.meets.push({id: uid(), date: nd, status: 'done', who: '', note: ''});
      g.st[nx] = nd; if (nx === 7 && !g.st[6]) {} d = nd; k = nx;
      if (k === 7) { stopped = 'done'; break; }
    }
    for (let j = 1; j < k; j++) if (!g.st[j] && !(k === 7 && j === 6)) g.st[j] = d;
    if (k === 4 && !g.meets.length) {
      if (stopped === 'fail') g.meets.push({id: uid(), date: addDays(d, 2), status: 'cancel', who: Math.random() < .7 ? 'her' : 'me', note: ''});
      else g.meets.push({id: uid(), date: addDays(t, rnd(1, 4)), status: 'plan', who: '', note: ''});
    }
    if (stopped === 'fail' && k < 7 && Math.random() < .75 && dDiff(d, t) > 3) {
      const ls = k === 5 ? 6 : k + 1, rs = REASONS[ls];
      if (ls === 5 && g.meets.some(m => m.status === 'cancel')) g.lost = {stage: 5, reason: g.meets.find(m => m.status === 'cancel').who === 'me' ? 'Отменил я' : 'Отменила она', note: '', date: addDays(d, 3)};
      else g.lost = {stage: ls, reason: rs[Math.floor(Math.pow(Math.random(), 1.6) * rs.length)], note: '', date: addDays(d, rnd(2, 6)) > t ? t : addDays(d, rnd(2, 6))};
    }
    DB.girls.push(g);
  });
  ensureNums();
}

/* ============ boot ============ */
function applyInsets() {
  const r = document.documentElement.style;
  let saT = 0, caT = 0, saB = 0, caB = 0;
  if (tg) {
    const sa = tg.safeAreaInset || {}, ca = tg.contentSafeAreaInset || {};
    saT = sa.top || 0; caT = ca.top || 0; saB = sa.bottom || 0; caB = ca.bottom || 0;
    // fullscreen without reported content inset: leave room for Telegram's own buttons
    if (tg.isFullscreen && !caT) caT = 48;
  }
  r.setProperty('--st', `calc(max(env(safe-area-inset-top,0px), ${saT}px) + ${caT}px)`);
  r.setProperty('--sb', `max(env(safe-area-inset-bottom,0px), ${saB + caB}px)`);
}
function applyTheme() {
  const dark = tg ? tg.colorScheme !== 'light' : !matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  try { if (ver('6.1')) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } if (ver('7.10')) tg.setBottomBarColor(bg); } catch (e) {}
}
(async function boot() {
  if (tg) { tg.ready(); tg.expand(); try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {} tg.onEvent('themeChanged', () => { applyTheme(); render(); }); ['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged','viewportChanged'].forEach(ev => tg.onEvent(ev, applyInsets)); }
  applyInsets();
  applyTheme();
  { let ch = ensureNums(); DB.girls.forEach(g => { if (syncStageMeets(g)) ch = true; if (!('ball' in g)) { g.ball = status(g) === 'active' ? AUTO_BALL[cur(g)] : ''; g.ballAt = lastDate(g) || today(); ch = true; } }); if (ch) save(); }
  render();
  await idb.open();
  Object.assign(PH, await idb.all());
  render();
  cloudLoad();
})();
</script>
